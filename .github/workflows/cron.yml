name: 5-Minute Cleanup Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cleanup Endpoint
        run: |
          if [ -n "${{ secrets.PRODUCTION_URL }}" ]; then
            curl -X GET "${{ secrets.PRODUCTION_URL }}/api/cron/cleanup"
          else
            echo "PRODUCTION_URL secret is not set in GitHub repository settings."
          fi
